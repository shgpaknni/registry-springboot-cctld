server:
  port: 8081

spring:
  application:
    name: cctld-registry

management:
  endpoints:
    web:
      exposure:
        include: health,info

registry:
  zone: xx
  db: ./data/registry
  epp:
    port: 7700
  rdap:
    bind: 127.0.0.1
    port: 8080
    rate-limit-burst: 20
    rate-limit-per-second: 10
  zone-file: ./data/zone.txt
  dnssec:
    enabled: false
    signer-command: dnssec-signzone
    verify-command: dnssec-verify
    key-directory: ./data/dnssec-keys
    # Replace these example values with the real authoritative nameservers for deployment.
    apex-ns: "ns1.example.net.,ns2.example.net."
    soa:
      mname: ns1.example.net.
      rname: hostmaster.example.net.
      refresh: 3600
      retry: 600
      expire: 1209600
      minimum: 300
  tls:
    keystore: certs/server.p12
    keystore-password: changeit
    truststore: certs/server-trust.p12
    truststore-password: changeit
  fees:
    create-per-year: 1000
    renew-per-year: 1000
    restore: 4000
  max-years: 10
  max-sessions-per-registrar: 10
  idle-seconds: 300
  pbkdf2-iterations: 60000
